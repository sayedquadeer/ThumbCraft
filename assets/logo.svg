<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tcGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#7600FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7600FF" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Icon Canvas Frame -->
  <rect x="10" y="15" width="120" height="90" rx="16" fill="url(#tcGlow)" filter="url(#shadow)"/>
  
  <!-- Canvas Inner Area -->
  <rect x="18" y="23" width="104" height="74" rx="10" fill="#0F172A"/>
  
  <!-- Creative Grid Lines (Subtle) -->
  <path d="M 18,60 L 122,60 M 70,23 L 70,97" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Play Button Core -->
  <polygon points="58,42 90,60 58,78" fill="url(#playGrad)"/>
  
  <!-- Spark / Craft Star -->
  <path d="M 115,15 L 118,25 L 128,28 L 118,31 L 115,41 L 112,31 L 102,28 L 112,25 Z" fill="#00E5FF"/>
  <path d="M 22,82 L 24,88 L 30,90 L 24,92 L 22,98 L 20,92 L 14,90 L 20,88 Z" fill="#FF0055"/>

  <!-- Brand Typography -->
  <text x="150" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">Thumb<tspan fill="url(#tcGlow)">Craft</tspan></text>
</svg>

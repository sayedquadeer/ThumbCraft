<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Description Generator - ThumbCraft</title>
  <meta name="description" content="Free browser-based YouTube Description Generator. Create high-converting SEO video descriptions instantly with no API key needed.">
  <link rel="canonical" href="https://sayedquadeer.github.io/ThumbCraft/description-generator.html">
  
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #1a1a24;
      --accent: #ff0055;
      --accent-hover: #ff2a70;
      --text-main: #f0f0f5;
      --text-muted: #a0a0b0;
      --border: #2a2a38;
      --input-bg: #12121a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a { color: inherit; text-decoration: none; }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
    nav a { margin-left: 1.5rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: var(--text-main); }
    
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; width: 100%; flex: 1; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); margin-bottom: 2rem; }

    .generator-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    label { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    
    input, select, textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea { resize: vertical; min-height: 180px; }

    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }

    .btn-primary { background: var(--accent); color: #fff; flex: 2; }
    .btn-primary:hover { background: var(--accent-hover); }
    
    .btn-secondary { background: #2a2a38; color: #fff; flex: 1; }
    .btn-secondary:hover { background: #3a3a4c; }

    .btn-danger { background: #381a20; color: #ff6b6b; border: 1px solid #5a202a; }
    .btn-danger:hover { background: #4a202a; }

    .counter-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      margin-top: 3rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="./index.html" class="logo">ThumbCraft</a>
    <nav>
      <a href="./index.html">Home</a>
      <a href="./description-generator.html">Description Generator</a>
    </nav>
  </header>

  <main>
    <h1>YouTube Description Generator</h1>
    <p class="subtitle">Create engaging, SEO-rich video descriptions right in your browser.</p>

    <div class="generator-container">
      <div class="form-group">
        <label for="topic">Video Title / Topic *</label>
        <input type="text" id="topic" placeholder="e.g., How to Build a Portfolio Website in 10 Minutes">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tone">Tone of Voice</label>
          <select id="tone">
            <option value="Engaging & Energetic">Engaging & Energetic</option>
            <option value="Informative & Professional">Informative & Professional</option>
            <option value="Casual & Friendly">Casual & Friendly</option>
            <option value="Minimal & Direct">Minimal & Direct</option>
          </select>
        </div>

        <div class="form-group">
          <label for="length">Description Length</label>
          <select id="length">
            <option value="Standard">Standard (Detailed)</option>
            <option value="Short">Short & Concise</option>
            <option value="Comprehensive">Comprehensive (Max SEO)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="keywords">Target Keywords (comma separated)</label>
        <input type="text" id="keywords" placeholder="e.g., web development, HTML tutorial, coding for beginners">
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" onclick="generateDescription()">⚡ Generate Description</button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 0.5rem 0;">

      <div class="form-group">
        <label for="output">Generated Description</label>
        <textarea id="output" placeholder="Your generated YouTube description will appear here..." oninput="updateCounter()"></textarea>
        <div class="counter-bar">
          <span id="charCount">Characters: 0 / 5,000</span>
          <span id="wordCount">Words: 0</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="copyDescription()">📋 Copy Text</button>
        <button type="button" class="btn btn-danger" onclick="clearAll()">🗑️ Clear</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ThumbCraft. Built for YouTube Creators.</p>
  </footer>

  <script>
    function generateDescription() {
      const topic = document.getElementById('topic').value.trim();
      const keywordsRaw = document.getElementById('keywords').value.trim();
      const tone = document.getElementById('tone').value;
      const length = document.getElementById('length').value;

      if (!topic) {
        alert('Please enter a Video Title or Topic.');
        return;
      }

      const keywordsList = keywordsRaw ? keywordsRaw.split(',').map(k => k.trim()).filter(k => k) : [];
      const hashtagList = keywordsList.map(k => '#' + k.replace(/\s+/g, '')).join(' ');

      let desc = '';

      // Hooks based on tone
      if (tone === 'Engaging & Energetic') {
        desc += `🚀 Welcome back to the channel! In this video, we're diving deep into "${topic}"! Make sure to watch until the end for essential tips you don't want to miss.\n\n`;
      } else if (tone === 'Informative & Professional') {
        desc += `In this video, we provide an in-depth walkthrough on "${topic}". This guide covers practical steps, best practices, and actionable insights.\n\n`;
      } else if (tone === 'Casual & Friendly') {
        desc += `Hey everyone! Today we are checking out "${topic}". Hope you find this super helpful and enjoyable!\n\n`;
      } else {
        desc += `Overview of "${topic}". Key details and summary included below.\n\n`;
      }

      if (length === 'Comprehensive' || length === 'Standard') {
        desc += `📌 What You'll Learn:\n`;
        desc += `• Key fundamentals of ${topic}\n`;
        desc += `• Step-by-step practical implementation\n`;
        desc += `• Pro tips and best practices for maximum productivity\n\n`;

        desc += `⏱️ Timestamps:\n`;
        desc += `00:00 - Introduction\n`;
        desc += `01:15 - Core Concepts & Overview\n`;
        desc += `04:30 - Step-by-Step Guide\n`;
        desc += `08:45 - Important Tips & Common Mistakes\n`;
        desc += `11:20 - Summary & Final Thoughts\n\n`;
      }

      desc += `🔔 Subscribe to the channel for more content like this!\n`;
      desc += `👍 If you found this video helpful, please give it a thumbs up and share it with others.\n\n`;

      if (keywordsList.length > 0) {
        desc += `🔍 Key Topics Covered:\n${keywordsList.map(k => `- ${k}`).join('\n')}\n\n`;
        desc += `${hashtagList}\n`;
      } else {
        desc += `#YouTube #${topic.replace(/\s+/g, '')}\n`;
      }

      const outputArea = document.getElementById('output');
      outputArea.value = desc;
      updateCounter();
    }

    function updateCounter() {
      const text = document.getElementById('output').value;
      const charCount = text.length;
      const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
      
      document.getElementById('charCount').textContent = `Characters: ${charCount.toLocaleString()} / 5,000`;
      document.getElementById('wordCount').textContent = `Words: ${wordCount.toLocaleString()}`;
    }

    function copyDescription() {
      const outputArea = document.getElementById('output');
      if (!outputArea.value) return;
      outputArea.select();
      navigator.clipboard.writeText(outputArea.value);
      alert('Description copied to clipboard!');
    }

    function clearAll() {
      document.getElementById('topic').value = '';
      document.getElementById('keywords').value = '';
      document.getElementById('output').value = '';
      updateCounter();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered.'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
  </html>
